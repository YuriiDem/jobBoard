server {
 listen 80;
 root /srv/board/public;
 index index.php;
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location = /index.php {
   include fastcgi_params;
   fastcgi_param SCRIPT_FILENAME /srv/board/public/index.php;
   fastcgi_pass app:9000;
 }
 location ~ \.php$ { return 404; }
 location ~ /\. { deny all; }
}
