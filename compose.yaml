x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME:-jobboard}-php

  env_file:
    - {path: .env, required: false}
  environment: &environment
    BOARD_STATE_DIR: /srv/board/state
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-http://localhost:${BOARD_PORT:-8080}}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_USERNAME: board
    DB_DATABASE: board
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    LOG_CHANNEL: stderr
  volumes:
    - state:/srv/board/state
    - credentials:/run/board:ro
  restart: unless-stopped
  depends_on: {init: {condition: service_completed_successfully}}

services:
  credentials:
    image: alpine:3.22
    volumes: [credentials:/run/board]
    command: ["sh","-ec","if [ ! -s /run/board/db_password ]; then umask 077; head -c 48 /dev/urandom | base64 > /run/board/new; chmod 444 /run/board/new; mv /run/board/new /run/board/db_password; fi"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: board
      POSTGRES_DB: board
      POSTGRES_PASSWORD_FILE: /run/board/db_password
    volumes: [postgres:/var/lib/postgresql/data, credentials:/run/board:ro]
    depends_on: {credentials: {condition: service_completed_successfully}}
    healthcheck: {test: ["CMD","pg_isready","-U","board","-d","board"], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
  init:
    <<: *runtime
    restart: "no"
    command: ["init"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  app:
    build: {context: ., target: runtime}
    <<: *runtime
  worker:
    <<: *runtime
    command: ["php","artisan","queue:work","--tries=3","--timeout=60"]
  scheduler:
    <<: *runtime
    command: ["php","artisan","schedule:work"]
  web:
    build: {context: ., target: web}
    ports: ["127.0.0.1:${BOARD_PORT:-8080}:80"]
    depends_on: [app]
    healthcheck: {test: ["CMD","wget","-qO","/dev/null","http://127.0.0.1/up"], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped
volumes:
  credentials: {}
  postgres: {}
  redis: {}
  state: {}
